<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Billing System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

  <h1 class="text-center mb-4">Hotel Billing System</h1>

  <!-- Menu Table -->
  <h3>Menu</h3>
  <table class="table table-bordered" id="menuTable">
    <thead>
      <tr>
        <th>Item</th>
        <th>Price (₹)</th>
        <th>Quantity</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Customer Name -->
  <div class="mb-3">
    <label class="form-label">Customer Name</label>
    <input type="text" id="customerName" class="form-control">
  </div>

  <!-- Generate Bill Button -->
  <button class="btn btn-primary" onclick="generateBill()">Generate Bill</button>

  <!-- Bill Display -->
  <div class="mt-4" id="billResult"></div>

  <script>
    // Fetch Menu from API
    fetch("/menu")
      .then(res => res.json())
      .then(data => {
        let tbody = document.querySelector("#menuTable tbody");
        Object.keys(data).forEach(item => {
          let price = data[item];
          tbody.innerHTML += `
            <tr>
              <td>${item}</td>
              <td>${price}</td>
              <td><input type="number" min="0" class="form-control qty" data-item="${item}" value="0"></td>
            </tr>
          `;
        });
      });

    // Generate Bill
    function generateBill() {
      let customer = document.getElementById("customerName").value;
      let qtyInputs = document.querySelectorAll(".qty");
      let items = [];

      qtyInputs.forEach(input => {
        let qty = parseInt(input.value);
        if (qty > 0) {
          items.push({ name: input.dataset.item, qty: qty });
        }
      });

      fetch("/order", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ customer_name: customer, items: items })
      })
      .then(res => res.json())
      .then(bill => {
        let html = `
          <h3>Bill for ${bill.customer_name}</h3>
          <p>Date/Time: ${bill.datetime}</p>
          <table class="table">
            <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
        `;
        bill.orders.forEach(o => {
          html += `<tr><td>${o.item}</td><td>${o.qty}</td><td>${o.price}</td><td>${o.total}</td></tr>`;
        });
        html += `
          </table>
          <p><strong>Subtotal:</strong> ₹${bill.subtotal}</p>
          <p><strong>Service Charge:</strong> ₹${bill.service_charge}</p>
          <p><strong>GST:</strong> ₹${bill.gst}</p>
          <h4>Total: ₹${bill.grand_total}</h4>
          <a href="/download/${bill.pdf_file}" class="btn btn-success mt-2">Download PDF</a>
        `;
        document.getElementById("billResult").innerHTML = html;
      });
    }
  </script>

</body>
</html>
